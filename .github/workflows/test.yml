name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # lint と、R8 を通すリリースビルド (署名なし) も確認する
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug assembleRelease --console=plain
